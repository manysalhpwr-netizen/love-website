
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Heart For You ❤️</title>
<link rel="icon" type="image/jpeg" href="eyes.jpg">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    gap: 8px;
    padding: 12px 8px;
}

h2 {
    color: #ff80ab;
    font-size: 18px;
    letter-spacing: 3px;
    text-align: center;
    margin: 0;
}

.heart-stage {
    width: 100%;
    max-width: 820px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

canvas {
    width: min(calc(100% - 100px), 700px);
    height: min(58vh, 550px);
    display: block;
    flex: 1;
    min-width: 0;
}

#musicButton {
    flex: 0 0 88px;
    background: #ff1744;
    color: white;
    border: 0;
    border-radius: 20px;
    padding: 14px 7px;
    font-size: 13px;
    cursor: pointer;
    z-index: 10;
}

#loveMessage {
    width: min(90vw, 600px);
    max-height: 22vh;
    overflow-y: auto;
    color: #ffb6c1;
    font-size: 15px;
    line-height: 2;
    text-align: center;
    direction: rtl;
    opacity: 0;
    transition: opacity 1.5s;
    white-space: pre-line;
    margin: 0;
}

/* Mobile Design */
@media (max-width: 600px) {

    body {
        gap: 12px;
        padding: 12px 8px;
        justify-content: center;
    }

    h2 {
        font-size: 15px;
        letter-spacing: 2px;
    }

    .heart-stage {
        width: 100%;
        gap: 5px;
    }

    canvas {
        width: calc(100% - 75px);
        height: 50svh;
        max-height: 430px;
        flex: 1;
        min-width: 0;
    }

    #musicButton {
        flex: 0 0 68px;
        padding: 12px 4px;
        font-size: 11px;
        border-radius: 16px;
        line-height: 1.5;
    }

    #loveMessage {
        width: 94vw;
        max-height: 24svh;
        font-size: 14px;
        line-height: 1.9;
        padding: 0 5px;
    }
}
</style>
</head>

<body>

<h2>I LOVE YOU FOR EVER "قشنگم"</h2>

<div class="heart-stage">
    <canvas id="heart"></canvas>
    <button id="musicButton">♥ Start Heart</button>
</div>

<div id="loveMessage"></div>

<audio id="music" src="love.mp3" loop></audio>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const music = document.getElementById("music");
const button = document.getElementById("musicButton");
const message = document.getElementById("loveMessage");

let width, height;
let points = [];
let index = 0;
let frame = 0;
let started = false;
let animationId = null;
let lastTime = 0;

let musicTimer = null;
let messageTimer = null;
let typingTimer = null;
let messageStarted = false;

const loveText =
"قشنگم...\n\n" +
"می‌دونی چقدر دوستت دارم؟ شاید نتونم همیشه بهت بگم، ولی واقعاً بودنت برام خیلی قشنگه. قربون اون خنده‌های قشنگت برم، الهی همیشه دلت شاد باشه. با حرف زدنت، خندیدنت و حتی اون اخلاقای خاصت دلمو می‌بری. فقط می‌خوام همیشه خوشحال باشی و بدونی که یه نفر هست که خیلی خیلی دوستت داره.\n\n" +
"دوستت دارم جوجه‌ی من ❤️";

const words = ["LOVE", "YOU", "LOVE", "LOVE"];

const colors = [
    "#ff1744",
    "#ff4081",
    "#ff80ab",
    "#ffb6c1"
];

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    width = rect.width;
    height = rect.height;

    createPoints();
}

function createPoints() {
    points = [];

    const scale = Math.min(width / 900, height / 800);

    for (let i = -9; i < 10; i++) {
        for (let j = -9; j < 10; j++) {

            const x = i * 0.14;
            const y = j * 0.14;

            const formula =
                Math.pow(x*x + y*y - 1, 3) -
                x*x*y*y*y;


if (formula <= 0) {
                points.push({
                    x: x * 240 * scale,
                    y: y * 240 * scale
                });
            }
        }
    }

    points.sort(() => Math.random() - 0.5);
}

function drawWord(x, y) {
    const word = words[Math.floor(Math.random() * words.length)];
    const color = colors[Math.floor(Math.random() * colors.length)];

    ctx.fillStyle = color;
    ctx.font = "bold 8px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(word, x, y);
}

function drawBuildingHeart() {
    const p = points[index];

    const x = width / 2 + p.x;
    const y = height / 2 - p.y;

    drawWord(x, y);
}

function drawHeart(scale = 1) {
    ctx.clearRect(0, 0, width, height);

    for (const p of points) {
        const x = width / 2 + p.x * scale;
        const y = height / 2 - p.y * scale;

        drawWord(x, y);
    }
}

function showMessage() {

    if (messageStarted || !started) return;

    messageStarted = true;

    messageTimer = setTimeout(() => {

        if (!started) return;

        message.style.opacity = "1";

        const letters = Array.from(loveText);
        let i = 0;

        typingTimer = setInterval(() => {

            if (!started) return;

            message.textContent += letters[i];
            i++;

            if (i >= letters.length) {
                clearInterval(typingTimer);
            }

        }, 65);

    }, 1200);
}

function animate(time) {

    if (!started) return;

    if (!lastTime) lastTime = time;

    if (index < points.length) {

        if (time - lastTime >= 20) {
            drawBuildingHeart();
            index++;
            lastTime = time;
        }

        if (index >= points.length) {
            showMessage();
        }

    } else {

        const phase = frame % 50;

        const beat1 = Math.exp(
            -Math.pow((phase - 8) / 3, 2)
        );

        const beat2 = Math.exp(
            -Math.pow((phase - 19) / 4, 2)
        );

        const scale = 1 + 0.07 * beat1 + 0.04 * beat2;

        if (time - lastTime >= 40) {
            drawHeart(scale);
            frame++;
            lastTime = time;
        }
    }

    animationId = requestAnimationFrame(animate);
}

function stopHeart() {

    started = false;

    cancelAnimationFrame(animationId);

    clearTimeout(musicTimer);
    clearTimeout(messageTimer);
    clearInterval(typingTimer);

    music.pause();
    music.currentTime = 0;

    ctx.clearRect(0, 0, width, height);

    message.textContent = "";
    message.style.opacity = "0";

    index = 0;
    frame = 0;
    lastTime = 0;
    messageStarted = false;

    button.textContent = "♥ Start Heart";
}

window.addEventListener("resize", () => {

    resize();

    if (started && index >= points.length) {
        drawHeart(1);
    }
});

resize();

button.addEventListener("click", () => {

    if (started) {
        stopHeart();
        return;
    }

    started = true;
    index = 0;
    frame = 0;
    lastTime = 0;
    messageStarted = false;

    message.textContent = "";
    message.style.opacity = "0";

    button.textContent = "♥ Stop Heart";

    musicTimer = setTimeout(() => {

        if (started) {
            music.currentTime = 0;

            music.play().catch(error => {
                console.log("Music playback error:", error);
            });
        }

    }, 4000);

    animationId = requestAnimationFrame(animate);

});

</script>

</body>
</html>
